[project]
name = "op-bot"
version = "0.2.0"
description = "Aiogram 3 BotoHub subscriptions, tasks, referral rewards, and moderation"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.0,<4.0",
  "aiohttp>=3.9",
  "SQLAlchemy>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
